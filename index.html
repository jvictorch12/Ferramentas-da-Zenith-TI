<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Nota Fiscal - Mobile & PC</title>
    <!-- Biblioteca html2pdf.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #219653; }

        /* Área da nota oculta da visualização normal do app */
        #nota-fiscal-preview {
            display: none;
            background: white;
            padding: 30px;
            width: 210mm;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .nf-header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .nf-title { font-size: 16px; font-weight: bold; text-align: right; }
        .nf-section { margin-top: 20px; font-weight: bold; background: #eee; padding: 6px 10px; font-size: 14px; }
        .nf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .nf-table th, .nf-table td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerador de Nota Fiscal</h2>
    <div class="form-group">
        <label>Nome do Cliente:</label>
        <input type="text" id="inputCliente" value="Empresa Exemplo S.A.">
    </div>
    <div class="form-group">
        <label>Descrição do Serviço:</label>
        <input type="text" id="inputServico" value="Desenvolvimento de Sistema Web">
    </div>
    <div class="form-group">
        <label>Valor (R$):</label>
        <input type="number" id="inputValor" value="2500.00">
    </div>

    <button onclick="gerarVisualizacaoPDF()">Visualizar Nota Fiscal em PDF</button>
</div>

<!-- Layout oculto que vira a Nota Fiscal PDF -->
<div id="nota-fiscal-preview">
    <div class="nf-header">
        <div>
            <strong>Sua Empresa de Tecnologia Ltda</strong><br>
            <span style="font-size: 12px; color: #555;">CNPJ: 00.000.000/0001-00</span>
        </div>
        <div class="nf-title">
            NOTA FISCAL DE SERVIÇOS<br>
            <span style="font-size: 12px; font-weight: normal;">Nº 000452</span>
        </div>
    </div>

    <div class="nf-section">Dados do Tomador</div>
    <p style="font-size: 14px;"><strong>Cliente:</strong> <span id="lblCliente"></span></p>

    <div class="nf-section">Discriminação dos Serviços</div>
    <table class="nf-table">
        <tr>
            <th>Descrição</th>
            <th style="width: 120px; text-align: right;">Valor Total</th>
        </tr>
        <tr>
            <td><span id="lblServico"></span></td>
            <td style="text-align: right;"><span id="lblValor"></span></td>
        </tr>
    </table>

    <div style="margin-top: 30px; text-align: right; font-size: 15px;">
        <strong>Valor Total da Nota: <span id="lblValorTotal"></span></strong>
    </div>
</div>

<script>
    function gerarVisualizacaoPDF() {
        // Preenche os dados dinâmicos
        document.getElementById('lblCliente').innerText = document.getElementById('inputCliente').value;
        document.getElementById('lblServico').innerText = document.getElementById('inputServico').value;
        
        let valorNum = parseFloat(document.getElementById('inputValor').value) || 0;
        let valorFormatado = valorNum.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        
        document.getElementById('lblValor').innerText = valorFormatado;
        document.getElementById('lblValorTotal').innerText = valorFormatado;

        const elementoNota = document.getElementById('nota-fiscal-preview');

        var opt = {
            margin:       10,
            filename:     'nota_fiscal.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        // Gera o PDF em Blob e abre para visualização imediata
        html2pdf().from(elementoNota).set(opt).outputPdf('blob').then(function(pdfBlob) {
            var blobUrl = URL.createObjectURL(pdfBlob);
            
            // Abre em nova aba (funciona muito bem em navegadores modernos de PC e celular)
            var novaAba = window.open(blobUrl, '_blank');
            
            // Caso algum navegador mobile bloqueie estritamente o window.open, criamos um link de fallback visual
            if (!novaAba) {
                alert("O navegador bloqueou a abertura automática. Clique OK para abrir o PDF.");
                window.location.href = blobUrl;
            }
        });
    }
</script>

</body>
</html>
